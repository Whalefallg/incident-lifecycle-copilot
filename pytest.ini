[pytest]
asyncio_mode = auto
addopts = -m "not live and not ragas_eval and not redis_integration"

markers =
    retrieval: RAG retrieval logic tests (no MCP Server required)
    live: tests requiring a running MCP RAG Server
    ragas_eval: Ragas LLM-as-Judge evaluation (requires MCP + LLM API key)
    redis_integration: tests requiring a live Redis server and embedding model
