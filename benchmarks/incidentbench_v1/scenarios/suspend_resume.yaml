- id: suspend-redis-001
  title: Suspend escalation for Redis question and resume
  category: suspend_resume
  live_mcp: true
  initial_state: {state: escalation, escalation_context: {service: checkout, severity: SEV-1}}
  steps: [{action: suspend}, {action: retrieve, request_id: sr-1, content: Redis maxmemory mitigation, document_ids: [redis-oom-runbook]}, {action: resume}]
  expectations: {final_state: escalation, required_states: [classify, escalation], required_document_ids: [redis-oom-runbook]}
- id: suspend-postgres-002
