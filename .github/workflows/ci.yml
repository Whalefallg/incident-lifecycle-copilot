name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Python checks
        run: |
          ruff check
          ruff format --check
          mypy
      - name: Offline backend tests
        env:
          RAG_MODE: local
          REDIS_STATE_ENABLED: "false"
          SEMANTIC_CACHE_ENABLED: "false"
          MODEL_ROUTING_ENABLED: "false"
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-production.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: python -m pip install -r ../requirements-production.txt
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Verify generated OpenAPI types are current
        run: |
          npm run generate:api
          git diff --exit-code -- src/api/generated/schema.d.ts

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Fixture-backed lifecycle E2E
        run: npm run test:e2e

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: incident-lifecycle-copilot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test production image
        run: |
          docker run -d --name incident-copilot-ci -p 8000:8000 \
            -e RAG_MODE=local \
            -e REDIS_STATE_ENABLED=false \
            -e SEMANTIC_CACHE_ENABLED=false \
            -e MODEL_ROUTING_ENABLED=false \
            incident-lifecycle-copilot:ci
          trap 'docker logs incident-copilot-ci; docker rm -f incident-copilot-ci' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/monitoring/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/ | grep -q "Incident Lifecycle Copilot"
          curl --fail --silent http://127.0.0.1:8000/incidents | grep -q "Incident Lifecycle Copilot"
          curl --fail --silent http://127.0.0.1:8000/incidents/INC-SPA | grep -q "Incident Lifecycle Copilot"
          curl --fail --silent http://127.0.0.1:8000/api/monitoring/health | grep -q '"status":"healthy"'
          curl --fail --silent http://127.0.0.1:8000/legacy | grep -q "Incident Lifecycle Copilot"
